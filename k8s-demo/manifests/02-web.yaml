apiVersion: apps/v1
kind: Deployment
metadata:
  name: qldpkh-web
  namespace: k8s-hoteluneti
  labels:
    app: qldpkh-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qldpkh-web
  template:
    metadata:
      labels:
        app: qldpkh-web
    spec:
      # Bỏ comment nếu image GHCR là private (cần tạo secret ghcr-cred trước, xem README A2/B1)
      # imagePullSecrets:
      #   - name: ghcr-cred
      containers:
        - name: web
          image: ghcr.io/quoc05dev/qlydatphongkhachsan_uneti_2_dhti17a2hn-web:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: SeedSampleData
              value: "true"
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: qldpkh-secrets
                  key: connection-string
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qldpkh-web
  namespace: k8s-hoteluneti
  labels:
    app: qldpkh-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: qldpkh-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qldpkh-web-ingress
  namespace: k8s-hoteluneti
  annotations:
    # CF Full(strict) + cert-manager cấp cert cho origin; KHÔNG force redirect
    # để tránh loop khi CF vẫn ở Flexible
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - uhotel.click
      secretName: uhotel-tls
  rules:
    - host: uhotel.click
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qldpkh-web
                port:
                  number: 8080
