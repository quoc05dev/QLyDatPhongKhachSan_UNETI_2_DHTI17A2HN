# =============================================================================
# Cert-Manager: ClusterIssuer + Certificate cho uhotel.click
#
# Yêu cầu:
#   - cert-manager đã cài trong cluster:
#     kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
#   - Domain uhotel.click đã trỏ A record về IP của cluster/LoadBalancer
#   - Ingress nginx đã cài trong cluster
#
# Deploy:
#   kubectl apply -f k8s-demo/03-cert-manager.yaml
# =============================================================================

---
# ClusterIssuer: dùng Let's Encrypt production để cấp cert thật
# (Thay email bằng email của bạn để nhận thông báo khi cert sắp hết hạn)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: dangminhquoc8@gmail.com   # <-- ĐỔI EMAIL NÀY
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
# Certificate: yêu cầu cert cho uhotel.click
# cert-manager sẽ tự động gia hạn trước 30 ngày khi hết hạn
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uhotel-tls
  namespace: hotel-demo
spec:
  secretName: uhotel-tls          # phải khớp với secretName trong Ingress
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - uhotel.click
    - www.uhotel.click             # thêm www nếu cần
