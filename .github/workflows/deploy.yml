name: CD (Auto Deploy)

# =============================================================================
# CI/CD tu dong:
#   1. publish-image: build Docker image tu Dockerfile -> push len GitHub
#      Container Registry (ghcr.io). Chi can GITHUB_TOKEN, KHONG can secret.
#   2. deploy: SSH vao server va cap nhat container (TUY CHON).
#
# Muon bat buoc deploy (job 2), cau hinh trong GitHub:
#   Settings > Secrets and variables > Actions
#     Variables:
#       DEPLOY_ENABLED = true
#       DEPLOY_PATH    = /duong/dan/toi/repo/tren/server   (vd: /srv/qldpkh)
#     Secrets:
#       DEPLOY_HOST     = IP hoac domain cua server
#       DEPLOY_USER     = user SSH (vd: ubuntu)
#       DEPLOY_SSH_KEY  = noi dung private key (OpenSSH)
#       DEPLOY_PORT     = 22            (tuy chon)
#       GHCR_USER       = username GitHub (neu package de Private)
#       GHCR_TOKEN      = PAT co quyen read:packages (neu package de Private)
#
# Tren server can co san: Docker + Docker Compose, repo da duoc clone tai
# DEPLOY_PATH, va file .env (chua MSSQL_SA_PASSWORD) da tao tu .env.example.
# =============================================================================

on:
  push:
    branches: [ main, test-deploy ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-image:
    name: Build & push image len GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tinh ten image (GHCR bat buoc chu thuong)
        id: vars
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}-web" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dang nhap GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag & label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy len server (tuy chon)
    runs-on: ubuntu-latest
    needs: publish-image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: SSH & cap nhat container
        uses: appleboy/ssh-action@v1
        env:
          WORKDIR: ${{ vars.DEPLOY_PATH }}
          REF: ${{ github.ref_name }}
          WEB_IMAGE: ${{ needs.publish-image.outputs.image }}:${{ needs.publish-image.outputs.tag }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: WORKDIR,REF,WEB_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$WORKDIR"

            # Neu package GHCR la Private thi can dang nhap truoc khi pull.
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # Dong bo code (lay docker-compose.yml moi nhat) va cap nhat container.
            git fetch --all --prune
            git checkout "$REF"
            git reset --hard "origin/$REF"

            export WEB_IMAGE
            docker compose pull web
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
