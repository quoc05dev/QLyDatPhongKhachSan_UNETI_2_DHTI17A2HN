name: CD (Auto Deploy)

# =============================================================================
# Trigger: moi lan push len main.
# Pipeline: CI gate -> build & push image GHCR -> SSH kubectl set image (K8s).
#
# Kiens truc sau chuyen doi: production chay tren Kubernetes (k3s) + ArgoCD.
#   - ArgoCD dong thuc manifest (sync/selfHeal) tu branch main.
#   - CI nay lam chu IMAGE: kubectl set image digest moi cho Deployment.
#   - ArgoCD co ignoreDifferences tren truong image (k8s-demo/argocd-app.yaml)
#     de 2 nguon khong ghi de nhau.
#   - Nguoi vao site van di qua host nginx (80/443) -> NodePort K8s.
#
# Secrets can thiet (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST    = IP hoac domain server
#   DEPLOY_USER    = root (can quyen kubectl/ k3s)
#   DEPLOY_SSH_KEY = noi dung private key SSH (OpenSSH)
#   DEPLOY_PORT    = 22 (tuy chon)
#
# Variables:
#   DEPLOY_ENABLED = true        (bat auto deploy)
#   DEPLOY_PATH    = /srv/qldpkh (khong con dung cho K8s, giu de ve sau)
#   NGINX_DOMAIN   = uhotel.click (khong con dung cho K8s - nginx cau hinh 1 lan)
#
# Package GHCR: Public -> khong can them secret nao.
# Tren server can co: kubectl/ k3s (dang chay), ArgoCD (dong thuc manifest).
# Deploy KHONG con chay docker compose va KHONG con cau hinh nginx (da cau hinh
# 1 lan trong Phase cut-over, xem deploy/setup-nginx.sh).
# =============================================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI gate — khong cho deploy neu build/test fail
  # ---------------------------------------------------------------------------
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # 2. Build Docker image & push len GHCR
  # ---------------------------------------------------------------------------
  publish-image:
    name: Build & push GHCR
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag:   ${{ github.ref_name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Tinh ten image (GHCR yeu cau chu thuong)
        id: vars
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Dang nhap GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag & label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. SSH -> kubectl set image (chi chay khi DEPLOY_ENABLED = true)
  #    CI lam chu image digest; ArgoCD lam chu manifest con lai.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy len K8s
    runs-on: ubuntu-latest
    needs: publish-image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read

    steps:
      - name: SSH -> kubectl set image -> rollout status -> rollback neu loi
        uses: appleboy/ssh-action@v1
        env:
          NS:          k8s-hoteluneti
          WEB_IMAGE:   ${{ needs.publish-image.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
        with:
          host:            ${{ secrets.DEPLOY_HOST }}
          username:        ${{ secrets.DEPLOY_USER }}
          key:             ${{ secrets.DEPLOY_SSH_KEY }}
          port:            ${{ secrets.DEPLOY_PORT || 22 }}
          envs:            NS,WEB_IMAGE,IMAGE_DIGEST
          command_timeout: 10m
          script: |
            set -euo pipefail

            # Luu image truoc do de rollback
            PREV_IMAGE=$(kubectl -n "$NS" get deploy qldpkh-web \
              -o jsonpath='{.spec.template.spec.containers[0].image}')

            echo "Cap nhat image: ${WEB_IMAGE}@${IMAGE_DIGEST}"
            kubectl -n "$NS" set image deploy/qldpkh-web \
              web="${WEB_IMAGE}@${IMAGE_DIGEST}"

            # Cho rollout toi da 180s (image pull + khoi dong + health)
            if kubectl -n "$NS" rollout status deploy/qldpkh-web --timeout=180s; then
              echo "Deploy thanh cong!"
              kubectl -n "$NS" get deploy qldpkh-web \
                -o jsonpath='{.spec.template.spec.containers[0].image}'; echo
              kubectl -n "$NS" get pods -l app=qldpkh-web
            else
              echo "FAIL: rollout loi -> rollback ve image cu ($PREV_IMAGE)"
              kubectl -n "$NS" set image deploy/qldpkh-web web="$PREV_IMAGE" || true
              kubectl -n "$NS" rollout status deploy/qldpkh-web --timeout=120s || true
              exit 1
            fi
