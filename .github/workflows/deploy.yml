name: CD (Auto Deploy)

# =============================================================================
# Trigger: moi lan push len main.
# Pipeline: CI gate → build & push image GHCR → SSH deploy len server.
#
# Secrets can thiet (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST    = IP hoac domain server
#   DEPLOY_USER    = ubuntu
#   DEPLOY_SSH_KEY = noi dung private key SSH (OpenSSH)
#   DEPLOY_PORT    = 22 (tuy chon)
#
# Variables:
#   DEPLOY_ENABLED = true      (bat auto deploy)
#   DEPLOY_PATH    = /srv/qldpkh  (thu muc repo tren server)
#
# Package GHCR: Public -> khong can them secret nao.
# Tren server can co: Docker, Docker Compose, repo da clone, file .env.
# =============================================================================

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. CI gate — khong cho deploy neu build/test fail
  # ---------------------------------------------------------------------------
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # 2. Build Docker image & push len GHCR
  # ---------------------------------------------------------------------------
  publish-image:
    name: Build & push GHCR
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag:   ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Tinh ten image (GHCR yeu cau chu thuong)
        id: vars
        run: echo "image=${REGISTRY}/${IMAGE_NAME,,}-web" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Dang nhap GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag & label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3. SSH deploy (chi chay khi DEPLOY_ENABLED = true)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy len server
    runs-on: ubuntu-latest
    needs: publish-image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read

    steps:
      - name: SSH → pull image → up → healthcheck → rollback neu loi
        uses: appleboy/ssh-action@v1
        env:
          WORKDIR:   ${{ vars.DEPLOY_PATH }}
          REF:       ${{ github.ref_name }}
          WEB_IMAGE: ${{ needs.publish-image.outputs.image }}:${{ github.ref_name }}
        with:
          host:            ${{ secrets.DEPLOY_HOST }}
          username:        ${{ secrets.DEPLOY_USER }}
          key:             ${{ secrets.DEPLOY_SSH_KEY }}
          port:            ${{ secrets.DEPLOY_PORT || 22 }}
          envs:            WORKDIR,REF,WEB_IMAGE
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "$WORKDIR"

            # Luu image dang chay de rollback
            PREV_IMAGE=$(docker inspect --format='{{index .Config.Image}}' \
              "$(docker compose ps -q web 2>/dev/null | head -1)" 2>/dev/null || true)

            # Lay docker-compose.yml moi nhat tu git
            git fetch --all --prune
            git reset --hard "origin/$REF"

            # Pull image moi & khoi dong
            export WEB_IMAGE
            docker compose pull web
            docker compose up -d --remove-orphans

            # Cho healthcheck (toi da 90s)
            echo "Dang cho web healthy..."
            for i in $(seq 1 18); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
                "$(docker compose ps -q web)" 2>/dev/null || echo "unknown")
              [ "$STATUS" = "healthy" ] && break
              sleep 5
            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose ps -q web)" 2>/dev/null || echo "unknown")

            if [ "$STATUS" != "healthy" ]; then
              echo "FAIL: Container khong healthy ($STATUS) -> rollback"
              [ -n "$PREV_IMAGE" ] && WEB_IMAGE="$PREV_IMAGE" docker compose up -d --remove-orphans
              exit 1
            fi

            docker image prune -f
            echo "Deploy thanh cong!"
            docker compose ps
