name: CD (Auto Deploy)

# =============================================================================
# Pipeline:
#   ci         → goi lai workflow CI lam gate truoc khi push image
#   publish    → build Docker image -> push len GHCR
#   deploy     → SSH vao server, cap nhat container, kiem tra healthy, rollback neu loi
#
# Bien phai cau hinh (Settings > Secrets and variables > Actions):
#   Variables:
#     DEPLOY_ENABLED = true
#     DEPLOY_PATH    = /duong/dan/tren/server   (vd: /srv/qldpkh)
#   Secrets:
#     DEPLOY_HOST    = IP hoac domain server
#     DEPLOY_USER    = user SSH (vd: ubuntu)
#     DEPLOY_SSH_KEY = noi dung private key (OpenSSH format)
#     DEPLOY_PORT    = 22  (tuy chon)
#     GHCR_USER      = username GitHub (chi can neu package de Private)
#     GHCR_TOKEN     = PAT read:packages  (chi can neu package de Private)
#
# Tren server can: Docker + Docker Compose, repo da clone tai DEPLOY_PATH,
# file .env da tao tu .env.example.
# =============================================================================

on:
  push:
    branches: [ main, test-deploy ]
  workflow_dispatch:

# CD khong cancel-in-progress de tranh deploy do dang
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Gate: CI phai pass truoc khi bat ky buoc deploy nao duoc chay
  # ---------------------------------------------------------------------------
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ---------------------------------------------------------------------------
  # Build & push image len GHCR
  # ---------------------------------------------------------------------------
  publish-image:
    name: Build & push image len GHCR
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag:   ${{ steps.vars.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Tinh ten image & tag
        id: vars
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME,,}-web" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_name }}"           >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Dang nhap GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sinh tag & label (branch + short-SHA + latest cho main)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (voi GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # SSH deploy (chi chay khi DEPLOY_ENABLED = true)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy len server
    runs-on: ubuntu-latest
    needs: publish-image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read

    steps:
      - name: SSH, cap nhat container & kiem tra healthy
        uses: appleboy/ssh-action@v1
        env:
          WORKDIR:    ${{ vars.DEPLOY_PATH }}
          REF:        ${{ github.ref_name }}
          WEB_IMAGE:  ${{ needs.publish-image.outputs.image }}:${{ needs.publish-image.outputs.tag }}
          GHCR_USER:  ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          envs:     WORKDIR,REF,WEB_IMAGE,GHCR_USER,GHCR_TOKEN
          # timeout SSH ket noi
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "$WORKDIR"

            # ---------- 1. Dang nhap GHCR (neu package Private) ----------
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            # ---------- 2. Dong bo code (lay docker-compose.yml moi nhat) ----------
            git fetch --all --prune
            git checkout "$REF"
            git reset --hard "origin/$REF"

            # ---------- 3. Ghi nho image hien tai de rollback neu can ----------
            PREV_IMAGE=$(docker inspect --format='{{index .Config.Image}}' \
              "$(docker compose ps -q web 2>/dev/null | head -1)" 2>/dev/null || echo "")

            # ---------- 4. Pull image moi & khoi dong lai service ----------
            export WEB_IMAGE
            docker compose pull web
            docker compose up -d --remove-orphans

            # ---------- 5. Cho healthcheck ket luan (toi da 90s) ----------
            echo "Cho healthcheck web san sang..."
            SECONDS_WAITED=0
            until [ "$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose ps -q web)")" = "healthy" ] || [ "$SECONDS_WAITED" -ge 90 ]; do
              sleep 5
              SECONDS_WAITED=$((SECONDS_WAITED + 5))
            done

            STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
              "$(docker compose ps -q web)" 2>/dev/null || echo "unknown")

            if [ "$STATUS" != "healthy" ]; then
              echo "!! Container khong healthy (status: $STATUS). Rollback..."
              if [ -n "$PREV_IMAGE" ]; then
                WEB_IMAGE="$PREV_IMAGE" docker compose up -d --remove-orphans
              else
                docker compose down
              fi
              exit 1
            fi

            # ---------- 6. Don dep image cu ----------
            docker image prune -f
            echo ""
            echo "=== Deploy thanh cong! Container hien tai: ==="
            docker compose ps
