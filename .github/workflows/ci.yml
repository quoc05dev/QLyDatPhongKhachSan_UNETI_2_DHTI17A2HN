name: CI

# Chay khi push/PR len main va khi deploy.yml goi lai lam CI gate.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: QLyDatPhongKhachSan/QLyDatPhongKhachSan.csproj

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Cai .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore & Build
        run: |
          dotnet restore ${{ env.PROJECT }}
          dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Test (bo qua neu chua co project test)
        id: test
        shell: bash
        run: |
          mapfile -t projs < <(find . -name '*.csproj' -iname '*test*')
          if [ "${#projs[@]}" -eq 0 ]; then
            echo "Chua co project test -> bo qua."
            exit 0
          fi
          for p in "${projs[@]}"; do
            dotnet test "$p" -c Release --logger trx --results-directory TestResults/
          done

      - name: Upload ket qua test (chi khi fail)
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: build
    # Chi build Docker de KIEM TRA Dockerfile khi PR (truoc khi merge) hoac
    # khi chay thu cong. Khi deploy.yml goi workflow nay, github.event_name van
    # la "push" -> bo qua buoc nay, boi job publish-image cua deploy se build
    # lai voi push: true. Tranh build Docker 2 lan moi lan release.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (khong push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: qldpkh-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
