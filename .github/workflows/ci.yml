name: CI

# Build + kiem tra tren moi lan push/PR. Khong can secret nao.
on:
  push:
    branches: [ main, test-deploy ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT: QLyDatPhongKhachSan/QLyDatPhongKhachSan.csproj

jobs:
  build:
    name: Build (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cai .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build (Release)
        run: dotnet build ${{ env.PROJECT }} -c Release --no-restore

      - name: Test (bo qua neu chua co project test)
        shell: bash
        run: |
          mapfile -t projs < <(find . -name '*.csproj' -iname '*test*')
          if [ "${#projs[@]}" -eq 0 ]; then
            echo "Khong co project test -> bo qua buoc nay."
            exit 0
          fi
          for p in "${projs[@]}"; do dotnet test "$p" -c Release; done

  docker:
    name: Kiem tra Docker build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (khong push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: qldpkh-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
