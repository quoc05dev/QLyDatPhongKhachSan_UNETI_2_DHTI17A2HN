# =============================================================================
# QLyDatPhongKhachSan - cau hinh deploy thu nghiem (test deploy)
#
# Cach dung:
#   1. copy .env.example thanh .env, dat MSSQL_SA_PASSWORD manh
#   2. neu can du lieu demo: dat SEED_SAMPLE_DATA=true va SEED_ADMIN_PASSWORD manh
#   3. docker compose up -d --build
#   4. mo http://localhost:8080
#
# Seed du lieu mau mac dinh TAT. Khi bat, bat buoc dat SEED_ADMIN_PASSWORD o
# moi truong Production de khong tao tai khoan admin/123456.
#
# Services:
#   db  - SQL Server 2022 Developer (luu tru du lieu)
#   web - ASP.NET Core MVC (ung dung chinh)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # SQL Server 2022 Developer (mien phi cho hoc tap / phat trien)
  # Ghim tag CU cu the (khong dung "2022-latest") de moi lan deploy cho cung ket qua.
  # Luu y: tren may ARM (Apple Silicon) hay doi image sang
  #        mcr.microsoft.com/azure-sql-edge.
  # ---------------------------------------------------------------------------
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    restart: on-failure:5
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required}"
    # Chi bind vao loopback: DB khong can truy cap tu ben ngoai (app ket noi
    # qua mang noi bo cua compose). Neu de 0.0.0.0, SQL Server se mo cong khai
    # ra Internet va bi bot quet mat khau SA brute-force.
    # Can ket noi SSMS tu may ngoai thi dung SSH tunnel:
    #   ssh -L 14330:127.0.0.1:14330 root@<IP>  roi SSMS ket noi localhost:14330
    ports:
      - "127.0.0.1:${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "for s in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do [ -x \"$$s\" ] && \"$$s\" -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null && exit 0; done; exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - hotel-net

  # ---------------------------------------------------------------------------
  # Web app (ASP.NET Core MVC)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # Mac dinh build local; tren server CD se ghi de bang image tu GHCR
    # (vd: ghcr.io/quoc05dev/...-web:main) => `docker compose pull` lay ban da build san.
    image: ${WEB_IMAGE:-qldpkh-web:local}
    restart: on-failure:5
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      # Ghi de ConnectionStrings:DefaultConnection trong appsettings.json.
      # Duong dan "db" la ten service, phan giai qua mang noi bo cua compose.
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=QLyDatPhongKhachSanDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD is required};TrustServerCertificate=True;MultipleActiveResultSets=true"
      # Mac dinh TAT. Chi bat khi can demo, va phai dat SEED_ADMIN_PASSWORD manh.
      SeedSampleData: "${SEED_SAMPLE_DATA:-false}"
      SeedAdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      # Chan Host header khong khop ten mien (co the ghi de qua ALLOWED_HOSTS).
      AllowedHosts: "${ALLOWED_HOSTS:-uhotel.click;www.uhotel.click;dev.uhotel.click;localhost;127.0.0.1}"
      # (Tuy chon) Dang nhap / dang ky bang Google OAuth.
      Authentication__Google__ClientId: "${GOOGLE_CLIENT_ID:-}"
      Authentication__Google__ClientSecret: "${GOOGLE_CLIENT_SECRET:-}"
      # Container chay HTTP thuan tuy (port 8080); nginx phia truoc terminate TLS.
      # Docker NAT co the doi source IP -> tin forwarded headers tu bridge noi bo.
      # An toan vi web chi bind 127.0.0.1, khong lo truc tiep ra Internet.
      TrustAllForwardedHeaders: "true"
    # Chi bind vao loopback: chi nginx tren cung may moi truy cap duoc.
    # Neu de 0.0.0.0, nguoi ngoai vao truc tiep http://IP:8090 se bypass qua
    # nginx (khong go qua firewall/Cloudflare).
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hotel-net

volumes:
  mssql-data:

networks:
  hotel-net:
    driver: bridge
